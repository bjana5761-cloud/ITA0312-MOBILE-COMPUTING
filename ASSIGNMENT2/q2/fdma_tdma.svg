<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"><rect width="100%" height="100%" fill="white"/><text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Q2 — FDMA vs TDMA</text><g font-family="Arial" font-size="18"><rect x="70" y="90" width="350" height="270" fill="#eef5ff" stroke="#1f4e79"/><rect x="480" y="90" width="350" height="270" fill="#eef9f0" stroke="#38761d"/><text x="245" y="130" text-anchor="middle" font-weight="bold">FDMA</text><text x="500" y="175">2 MHz ÷ 25 kHz = 80</text><text x="500" y="215">− 2 guard − 3 control</text><text x="500" y="255">= 75 usable traffic</text><text x="500" y="295">95% payload efficiency</text><text x="655" y="130" text-anchor="middle" font-weight="bold">TDMA</text><text x="500" y="175">10 carriers × 8 = 80</text><text x="500" y="215">− stated edge/control overhead</text><text x="500" y="255">= 70 usable traffic</text><text x="500" y="295">73% payload efficiency</text></g></svg>